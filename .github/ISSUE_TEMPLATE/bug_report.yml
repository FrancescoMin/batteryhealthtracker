name: "🐛 Bug Report"
description: "Report a software defect, crash, or unexpected behavior in Battery Health Tracker."
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        ### 🐛 Bug Report
        Thank you for reporting an issue! Please provide as much detail as possible to help reproduce and fix the bug.
  - type: input
    id: app-version
    attributes:
      label: App Version
      placeholder: "e.g. 1.5 (versionCode 6)"
    validations:
      required: true
  - type: input
    id: device-model
    attributes:
      label: Device & OS Version
      placeholder: "e.g. Oppo Reno 14 (Android 15 / ColorOS 15), Realme GT 7T"
    validations:
      required: true
  - type: textarea
    id: bug-description
    attributes:
      label: Describe the Bug
      description: "A clear and concise description of what the bug is."
      placeholder: "When doing X, Y occurs instead of Z..."
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to Reproduce
      description: "Step-by-step instructions to reproduce the issue."
      placeholder: |
        1. Open the app
        2. Tap on ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: "What did you expect to happen?"
    validations:
      required: true
  - type: textarea
    id: logs-and-screenshots
    attributes:
      label: Diagnostic Logs / Screenshots
      description: "Paste Diagnostic Console output or attach relevant screenshots."
  - type: checkboxes
    id: bug-checklist
    attributes:
      label: Checklist
      options:
        - label: "I searched existing issues to ensure this bug has not been reported already."
          required: true
        - label: "I did not include sensitive personal data (IMEI, private accounts, phone numbers)."
          required: true
